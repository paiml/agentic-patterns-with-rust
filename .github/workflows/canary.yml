# Weekly check that the learner build still works on the latest hosted images
# and the latest stable Rust. A red run here means the toolchain or image moved
# under the course, not that a pull request broke something.
name: canary

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  canary:
    name: canary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: examples/demos
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            examples/demos/target
          key: cargo-canary-${{ runner.os }}-${{ hashFiles('examples/demos/Cargo.lock') }}
          restore-keys: |
            cargo-canary-${{ runner.os }}-

      - name: Tests
        run: cargo test --workspace --locked

      - name: Verify pins and provable contracts
        run: cargo run -q --locked -p xtask -- verify
