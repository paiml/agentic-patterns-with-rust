# Required status check: the job named `gate` at the top level of this
# workflow. It needs every other job, so it is green only when they all are.
# Keep that job name; renaming it blocks every pull request.
#
# Every job runs on a pinned ubuntu-24.04 image with a pinned Rust toolchain
# and no secrets, so pull requests from forks run the same checks. The weekly
# canary workflow runs the learner build on the latest hosted images.
name: gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  readme:
    name: readme
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Runs before the real check: the checker must catch every deliberately
      # broken copy of this repository and pass the clean one.
      - name: Prove the checker can still fail
        run: .github/scripts/check-readme-consistency.sh --self-test

      - name: Cross-check every README against its TOML
        run: .github/scripts/check-readme-consistency.sh

  demos:
    name: demos
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: examples/demos
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            examples/demos/target
          key: cargo-demos-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('examples/demos/Cargo.lock') }}
          restore-keys: |
            cargo-demos-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      - name: Verify pins and provable contracts
        run: cargo run -q --locked -p xtask -- verify

  coverage:
    name: coverage (report)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: examples/demos
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: llvm-tools-preview

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            examples/demos/target
          key: cargo-coverage-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('examples/demos/Cargo.lock') }}
          restore-keys: |
            cargo-coverage-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.6.21

      # Report mode: prints the number and passes, because line coverage is
      # below 100%. Make it enforcing with --fail-under-lines 100 once it is.
      - name: Line coverage (report only, below 100%)
        run: cargo llvm-cov --workspace --locked --summary-only

  gate:
    name: gate
    needs: [readme, demos, coverage]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Verify all jobs succeeded
        run: |
          if [ "${{ needs.readme.result }}" != "success" ] || [ "${{ needs.demos.result }}" != "success" ] || [ "${{ needs.coverage.result }}" != "success" ]; then
            echo "::error::readme=${{ needs.readme.result }} demos=${{ needs.demos.result }} coverage=${{ needs.coverage.result }}"
            exit 1
          fi
          echo "all gates passed"
